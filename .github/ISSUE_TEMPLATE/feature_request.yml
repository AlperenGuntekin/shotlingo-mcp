name: Feature request
description: Suggest a new tool, skill, client config or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests for the hosted server are welcome here. If you are not sure the idea is ready, start in Discussions, Ideas.
  - type: dropdown
    id: area
    attributes:
      label: What would it change?
      options:
        - MCP server (new or changed tool)
        - Claude Code plugin or command
        - Skills
        - Store page audit
        - Client config for another editor
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, as an example prompt to your agent if that is easiest.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
